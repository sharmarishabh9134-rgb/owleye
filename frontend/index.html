<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OwlEye</title>
<style>
  :root { --navy:#14284f; --ink:#0b1630; --orange:#f58a1f; --cream:#fbf6e9; --card:#fff; --muted:#5a6479;
          --red:#e5484d; --amber:#d98a00; --green:#17986f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Calibri, "Segoe UI", system-ui, sans-serif; background:var(--cream); color:var(--ink); }
  header { padding:28px 20px 8px; max-width:1000px; margin:0 auto; }
  h1 { margin:0; font-size:2rem; color:var(--navy); }
  h1 span { color:var(--orange); }
  header p { margin:6px 0 0; color:var(--muted); }
  main { max-width:1000px; margin:0 auto; padding:16px 20px 48px; display:grid; gap:20px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border-radius:14px; padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  label { display:block; font-weight:700; margin:12px 0 4px; font-size:.9rem; }
  textarea, input { width:100%; padding:10px; border:1px solid #cfd5e3; border-radius:8px; font:inherit; }
  textarea { min-height:190px; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  button { border:0; border-radius:999px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
  .primary { background:var(--orange); color:var(--ink); }
  .ghost { background:#eef1f8; color:var(--navy); }
  button:disabled { opacity:.6; cursor:wait; }
  .score { display:flex; align-items:center; gap:16px; }
  .gauge { --pct:0; --c:var(--green); width:110px; height:110px; border-radius:50%;
           background: conic-gradient(var(--c) calc(var(--pct) * 1%), #e6e9f2 0); display:grid; place-items:center; }
  .gauge div { width:80px; height:80px; border-radius:50%; background:#fff; display:grid; place-items:center; font-size:1.9rem; font-weight:800; }
  .pill { display:inline-block; padding:4px 14px; border-radius:999px; color:#fff; font-weight:800; }
  ul { padding:0; list-style:none; margin:14px 0 0; }
  li { padding:9px 10px; border-radius:8px; background:#f6f7fb; margin-bottom:8px; }
  li small { display:block; color:var(--muted); margin-top:2px; word-break:break-word; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:10px; }
  pre { white-space:pre-wrap; background:#f6f7fb; padding:12px; border-radius:8px; font-size:.85rem; max-height:260px; overflow:auto; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Owl<span>Eye</span></h1>
  <p>Paste an internship offer. Get a risk score with reasons before you apply or pay.</p>
</header>
<main>
  <section class="card" aria-label="Offer details">
    <label for="text">Offer text (email, WhatsApp, Telegram, offer letter)</label>
    <textarea id="text" placeholder="Paste the message here..."></textarea>
    <label for="url">Link (optional)</label>
    <input id="url" placeholder="https://...">
    <label for="sender">Sender email (optional)</label>
    <input id="sender" placeholder="hr@company.com">
    <label for="company">Company named in the offer (optional)</label>
    <input id="company" placeholder="Company name">
    <div class="row">
      <button class="primary" id="go">Check this offer</button>
      <button class="ghost" id="fake">Try a fake sample</button>
      <button class="ghost" id="real">Try a genuine sample</button>
    </div>
    <p class="hint">Nothing is stored. Heuristic estimate, not proof of fraud.</p>
  </section>
  <section class="card" aria-live="polite" aria-label="Result">
    <p id="empty" class="hint">Your result will appear here.</p>
    <div id="result" class="hidden">
      <div class="score">
        <div class="gauge" id="gauge"><div id="num">0</div></div>
        <div><span class="pill" id="level"></span><p id="rec"></p></div>
      </div>
      <ul id="reasons"></ul>
      <p class="hint" id="na"></p>
      <div id="reportBox" class="hidden">
        <h3>Complaint draft (cybercrime.gov.in / helpline 1930)</h3>
        <pre id="report"></pre>
        <button class="ghost" id="copy">Copy draft</button>
      </div>
    </div>
    <p id="err" class="hint" style="color:var(--red)"></p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = { HIGH: "var(--red)", MEDIUM: "var(--amber)", LOW: "var(--green)" };

async function loadSample(name, sender, company, url) {
  const r = await fetch("/samples/" + name);
  $("text").value = await r.text();
  $("sender").value = sender; $("company").value = company; $("url").value = url;
}
$("fake").onclick = () => loadSample("fake_offer.txt", "tcs.careers.hr@gmail.com", "TCS", "");
$("real").onclick = () => loadSample("genuine_offer.txt", "meera@acmerobotics.in", "Acme Robotics Pvt Ltd", "");

$("go").onclick = async () => {
  $("err").textContent = "";
  $("go").disabled = true; $("go").textContent = "Checking...";
  try {
    const r = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("text").value, url: $("url").value || null,
                             sender_email: $("sender").value || null, company: $("company").value || null }) });
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Please check your input.");
    render(d);
  } catch (e) { $("err").textContent = e.message; }
  finally { $("go").disabled = false; $("go").textContent = "Check this offer"; }
};

function render(d) {
  $("empty").classList.add("hidden"); $("result").classList.remove("hidden");
  $("num").textContent = d.score;
  const g = $("gauge"); g.style.setProperty("--pct", d.score); g.style.setProperty("--c", COLORS[d.level]);
  const lv = $("level"); lv.textContent = d.level + " RISK"; lv.style.background = COLORS[d.level];
  $("rec").textContent = d.recommendation;
  const ul = $("reasons"); ul.replaceChildren();
  if (!d.reasons.length) { const li = document.createElement("li"); li.textContent = "No red flags found in the details provided."; ul.append(li); }
  for (const r of d.reasons) {
    const li = document.createElement("li"); li.textContent = r.label;
    if (r.evidence) { const s = document.createElement("small"); s.textContent = "Found: " + r.evidence; li.append(s); }
    ul.append(li);
  }
  $("na").textContent = d.unavailable_checks.length ? "Could not verify: " + d.unavailable_checks.join("; ") + ". These add no risk." : "";
  $("reportBox").classList.toggle("hidden", !d.report_draft);
  $("report").textContent = d.report_draft || "";
}
$("copy").onclick = async () => { try { await navigator.clipboard.writeText($("report").textContent); $("copy").textContent = "Copied"; } catch { $("copy").textContent = "Select and copy manually"; } };
</script>
</body>
</html>
